# Vantara Customer Intelligence Platform – central configuration.
# All paths, hyperparameters and thresholds live here (PRD Section 13).

project:
  name: "Vantara Customer Intelligence Platform"
  random_seed: 42
  log_level: "INFO"

paths:
  raw_data: "data/raw/online_retail_raw.pkl"
  interim_data: "data/interim/transactions_clean.parquet"
  processed_features: "data/processed/customer_features.parquet"
  processed_sequences: "data/processed/customer_sequences.npz"
  models_dir: "models_artifacts"
  experiment_log: "models_artifacts/experiment_log.csv"

features:
  snapshot_date: "2011-09-09"        # point-in-time cutoff (max InvoiceDate is 2011-12-09)
  churn_window_days: 90              # no purchase within 90 days after snapshot => churned
  clv_window_days: 180               # future revenue horizon for CLV regression target
  rfm_quantiles: 4
  min_purchases_for_clv: 2           # CLV regression only on repeat customers

data_cleaning:
  iqr_multiplier: 3.0                # generous IQR bound to keep legitimate bulk orders
  admin_stock_codes: ["POST", "DOT", "M", "BANK CHARGES", "PADS"]
  max_unit_price: 5000.0             # domain rule: data-entry errors above this
  max_quantity: 10000.0              # domain rule: bulk wholesale ceiling

models:
  test_size: 0.15
  val_size: 0.15                     # of remaining 70% train -> 55/15/15 overall
  smote: true
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.9
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 3
  knn:
    n_neighbors: 15
  logistic_regression:
    C: 1.0
    penalty: "l2"
    max_iter: 2000
  ann:
    hidden_dims: [128, 64, 32]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 64
    max_epochs: 100
    patience: 10
  lstm:
    hidden_dim: 64
    n_layers: 1
    max_len: 40
    learning_rate: 0.001
    batch_size: 64
    max_epochs: 60
    patience: 8
  autoencoder:
    encoding_dim: 8
    learning_rate: 0.001
    batch_size: 64
    max_epochs: 60
    patience: 8
    anomaly_percentile: 95.0         # reconstruction-error threshold percentile

segmentation:
  k_range: [2, 3, 4, 5, 6, 7, 8]
  chosen_k: null                     # overwritten at runtime by silhouette selection
  gmm_components: null               # same as chosen_k
  pca_components: 2

api:
  host: "0.0.0.0"
  port: 8000
  database_url_env: "DATABASE_URL"   # defaults to sqlite:///./vantara.db locally

dashboard:
  port: 8501
  forecast_days: 90
